name: Deploy PISS Hub

on:
  push:
    branches:
      - master

concurrency:
  group: piss-hub-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Update application
        run: |
          set -e
          cd /opt/lampp/htdocs/piss-hub
          git fetch origin master
          git reset --hard origin/master

      - name: Verify deployment
        run: |
          set -e
          test -f /opt/lampp/htdocs/piss-hub/index.php
          test -d /opt/lampp/htdocs/piss-hub/uploads
          echo "PISS Hub deployment successful"
